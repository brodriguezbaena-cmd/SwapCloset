spring.application.name=SwapCloset

# --- Conexion a la base de datos (con valores por defecto tras el dos puntos)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=Swapcloset
spring.jpa.properties.hibernate.default_schema="Swapcloset"
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Servidor (ojo: suele ser 8080)
server.port=8080

app.jwt.secret=SwapClosetClaveSecretaSuperSegura2026ParaTokensJWTDe256Bits
app.jwt.expiration-ms=3600000