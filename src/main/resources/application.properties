spring.application.name=SwapCloset

# --- Conexion a la base de datos (con valores por defecto tras el dos puntos)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/swapcloset}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Servidor (ojo: suele ser 8080)
server.port=8080